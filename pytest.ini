[pytest]
# Test discovery
testpaths = tests

# Coverage options (per TECH_STACK.md §5.2)
# Note: --cov-fail-under=80 only enforces once engine/ is populated (Phase 2+).
# For Phase 1 we report coverage without failing on threshold.
addopts =
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    -v

# Asyncio mode for pytest-asyncio
asyncio_mode = auto

# Markers
markers =
    unit: Pure unit tests with no I/O
    integration: Integration tests that touch the database or HTTP
    slow: Tests that take more than 1 second
