services:
  - type: web
    name: searchforge-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m nltk.downloader punkt stopwords punkt_tab
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.11.9
